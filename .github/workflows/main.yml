name: Deploy to AWS ECS
on:
  push:
    branches:
      - main

jobs:
  scan:
    name: Scan Code with Snyk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install Snyk CLI
        run: |
          curl -Lo snyk https://github.com/snyk/snyk/releases/latest/download/snyk-linux
          chmod +x snyk
          sudo mv snyk /usr/local/bin/

      - name: Authenticate with Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}
      
      - name: Scan app.py with Snyk
        run: snyk code test --file=app.py --json > snyk_report.json || true
      
      - name: Convert JSON to Text
        run: |
          jq -r '.runs[].results[] | "Rule: \(.ruleId) - Severity: \(.level) - Message: \(.message.text)"' snyk_report.json > snyk_report.txt || echo "No vulnerabilities found" > snyk_report.txt
      
      - name: Upload Snyk Report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk_report.txt

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2 

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, Tag, and Push image to Amazon ECR
        env:
          ECR_REPOSITORY: flask-backend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG

  image-scan:
    name: Scan Image with Trivy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget curl jq
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh
      
      - name: Scan Image with Trivy
        env:
          ECR_REPOSITORY: flask-backend
          IMAGE_TAG: latest
        run: |
          trivy image --format json --output trivy_report.json ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG || true
      
      - name: Convert JSON to Text
        run: |
          if jq -e '.Results[].Vulnerabilities' trivy_report.json > /dev/null; then
            jq -r '.Results[].Vulnerabilities[] | "ID: \(.VulnerabilityID) - Severity: \(.Severity) - Package: \(.PkgName) - Description: \(.Description)"' trivy_report.json > trivy_report.txt
          else
            echo "No vulnerabilities found, but full report available in JSON format." > trivy_report.txt
          fi
      
      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy_report.txt
            trivy_report.json

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: image-scan
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2 

      - name: Update ECS Service
        run: |
          aws ecs update-service --cluster applicationclusters --service backend-servies --force-new-deployment --desired-count 1 --task-definition backend-td:2
